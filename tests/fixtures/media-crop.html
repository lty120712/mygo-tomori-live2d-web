<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><title>图片视频裁剪隔离验证</title>
<style>:root{font:14px system-ui;--editor-text:#342e35;--editor-muted:#817580;--editor-soft:#f6f3f5;--editor-border:#ded5dc}body{margin:16px;background:#f6f3f5;color:#342e35}main{min-width:1000px}header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.layout{display:grid;grid-template-columns:minmax(500px,1fr) 290px;gap:16px}.preview{height:480px;display:flex;flex-direction:column}aside{background:white;padding:16px}button{padding:6px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px monospace}output{display:block;padding:10px;background:#fff}</style>
<div id="app">准备内存测试素材…</div><script type="module">
import {createApp,h,ref} from 'vue'
import {useSceneEditor} from '../../src/composables/useSceneEditor.js'
import {createLocalStore,memoryDocumentBackend,SCENE_KEY} from '../../src/localStore.js'
import {createAssetStore,memoryBackend} from '../../src/assetStore.js'
import {createProject,readProject} from '../../src/sceneProject.js'
import {createImageClip,createVideoClip,mediaDimensions} from '../../src/mediaTracks.js'
import SceneCanvas from '../../src/components/SceneCanvas.vue'
import MediaCropInspector from '../../src/components/MediaCropInspector.vue'
import MediaMaskInspector from '../../src/components/MediaMaskInspector.vue'
import MediaColorInspector from '../../src/components/MediaColorInspector.vue'
import MediaAnimationInspector from '../../src/components/MediaAnimationInspector.vue'
import {sampleMediaAnimation} from '../../src/mediaAnimation.js'
const assets=createAssetStore(memoryBackend(),{probeImage:async()=>({width:800,height:400}),probeVideo:async()=>({width:800,height:400,duration:1,thumb:''})})
const source=document.createElement('canvas');source.width=800;source.height=400
const ctx=source.getContext('2d');['#e95858','#48bd7b','#478ee8','#f1ce57'].forEach((color,i)=>{ctx.fillStyle=color;ctx.fillRect(i*200,0,200,400);ctx.fillStyle='#fff';ctx.font='bold 60px sans-serif';ctx.fillText(String(i+1),i*200+80,220)})
const image=await assets.importFile(new File([await new Promise(resolve=>source.toBlob(resolve))],'四色图片.png',{type:'image/png'}))
const stream=source.captureStream(15),chunks=[],recorder=new MediaRecorder(stream,{mimeType:'video/webm'})
const recording=new Promise(resolve=>{recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=resolve});recorder.start();const redraw=setInterval(()=>{ctx.fillStyle='#fff';ctx.fillRect(0,0,1,1);stream.getVideoTracks()[0].requestFrame?.()},50);await new Promise(resolve=>setTimeout(resolve,700));clearInterval(redraw);recorder.stop();await recording;stream.getTracks().forEach(t=>t.stop())
const video=await assets.importFile(new File(chunks,'四色视频.webm',{type:'video/webm'}))
const store=createLocalStore(memoryDocumentBackend()),p=createProject();p.clips=[];p.imageClips=[createImageClip(image),createVideoClip(video,5,1,1)];await store.set(SCENE_KEY,p)
createApp({setup(){const e=useSceneEditor({store}),result=ref(''),kind=ref('图片')
function choose(index){const clip=e.project.imageClips[index];e.selectCanvas([clip.id],clip.id);e.seek(clip.start);kind.value=clip.media==='video'?'视频':'图片'}
function fractional(){const next=JSON.parse(JSON.stringify(e.project));Object.assign(next.imageClips[0],{start:.123,duration:4.321,offset:.456});Object.assign(e.project,readProject(next,[]));choose(0);e.seek(.2)}
function compare(){const exported=e.sceneCanvas.value.getCanvas(),preview=document.querySelector('canvas[aria-label="场景合成画布"]');result.value=preview && exported.toDataURL()===preview.toDataURL()?'预览与导出帧逐像素一致':'预览与导出帧不同'}
async function record(withAudio=false){
  let audio=null,oscillator=null,destination=null
  if(withAudio===true){audio=new AudioContext();await audio.resume();oscillator=audio.createOscillator();const gain=audio.createGain();gain.gain.value=.15;destination=audio.createMediaStreamDestination();oscillator.connect(gain).connect(destination);oscillator.start()}
  if(e.recorder.start(e.sceneCanvas.value.getCanvas(),destination?.stream,'canvas',null,null,e.project.fps))setTimeout(()=>{e.recorder.stop();oscillator?.stop();audio?.close()},2000)
  else {oscillator?.stop();audio?.close()}
}
async function convertSample(){
  result.value='正在验证 WebM → MP4 本地转码…'
  try{const {transcodeMp4}=await import('../../src/mp4Transcoder.js');const blob=await transcodeMp4(new Blob(chunks,{type:'video/webm'}));const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='tomori-crop-transcoded.mp4';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);result.value='本地 MP4 转码完成：'+blob.size+' 字节'}catch(error){result.value='本地转码失败：'+error.message}
}
return ()=>h('main',[h('h2','图片／视频 · 裁剪与适应画布'),h('p','隔离验证：素材和工程仅在内存中，不修改用户数据。色块 1 / 2 / 3 / 4 用于检查源区域。'),h('header',[
h('button',{onClick:()=>choose(0)},'选择图片'),h('button',{onClick:()=>choose(1)},'选择视频'),h('button',{onClick:()=>e.changeAspectRatio('16:9')},'横屏'),h('button',{onClick:()=>e.changeAspectRatio('9:16')},'竖屏'),h('button',{onClick:e.undo,disabled:!e.canUndo.value},'撤销'),h('button',{onClick:e.redo,disabled:!e.canRedo.value},'重做'),h('button',{onClick:()=>e.changeLayerState(e.selected.value.track,{layerLocked:!e.selected.value.layerLocked}),disabled:!e.selected.value},'切换锁定'),h('button',{onClick:compare},'比较预览与导出帧'),h('button',{onClick:record,disabled:e.recorder.isRecording.value || e.recorder.isExporting.value},'录制两秒 MP4'),h('button',{onClick:()=>record(true),disabled:e.recorder.isRecording.value || e.recorder.isExporting.value},'录制两秒带声音 MP4'),h('button',{onClick:convertSample},'验证本地 MP4 转码'),h('button',{onClick:fractional},'载入非整帧起点'),h('label',['播放头',h('input',{'aria-label':'测试播放头',type:'number',min:0,max:e.project.duration,step:1/e.project.fps,value:e.time.value,onInput:event=>e.seek(Number(event.target.value))})]),h('button',{onClick:()=>e.playing.value?e.pause():e.play()},'播放／暂停'),h('button',{onClick:e.split,disabled:!e.canSplit.value},'切割当前片段'),h('button',{onClick:()=>choose(e.project.imageClips.length-1)},'选中切割后半段'),h('button',{onClick:e.record,disabled:e.locked.value},'导出完整测试工程视频'),h('button',{onClick:()=>{if(!e.project.imageClips.some(c=>c.name==='下层参考图'))e.project.imageClips.push(createImageClip({...image,name:'下层参考图'},0,5,2));choose(0)}},'添加下层参考图'),h('button',{onClick:()=>e.transformModel(e.selected.value.id,{rotation:30,scaleX:1.3,scaleY:.7})},'旋转与拉伸遮罩')]),
h('div',{class:'layout'},[h('section',[h('div',{class:'preview'},[h(SceneCanvas,{clips:e.allClips.value,assetProvider:assets,playing:e.playing.value,recording:e.recorder.isRecording.value,background:'#7a8c9f',time:e.time.value,duration:e.project.duration,fps:e.project.fps,aspectRatio:e.project.aspectRatio,selected:e.selected.value,selectedIds:e.canvasSelection.value,runtimes:e.runtimes,ref:e.sceneCanvas,onSelect:e.selectCanvas,onBeginEdit:e.beginEdit,onEndEdit:e.endEdit,onTransform:e.transformModel,onMove:e.moveModel})]),h('output',result.value),h('pre',{id:'result'},JSON.stringify({kind:kind.value,time:e.time.value,count:e.project.imageClips.length,aspect:e.project.aspectRatio,clip:e.selected.value && {name:e.selected.value.name,track:e.selected.value.track,mask:e.selected.value.mask,flipX:e.selected.value.flipX,flipY:e.selected.value.flipY,adjustments:e.selected.value.adjustments,animation:e.selected.value.animation,animationEnd:e.selected.value.mediaAnimationEnd,animationSample:sampleMediaAnimation(e.selected.value,e.time.value,e.project.fps),offset:e.selected.value.offset,crop:e.selected.value.crop,dimensions:mediaDimensions(e.selected.value),transform:e.selected.value.transform,start:e.selected.value.start,duration:e.selected.value.duration,locked:e.selected.value.layerLocked},message:e.message.value},null,2))]),h('aside',e.selected.value?[h(MediaMaskInspector,{clip:e.selected.value,disabled:e.editLocked.value,onEdit:patch=>e.editClip(e.selected.value.id,patch),onBeginEdit:e.beginEdit,onEndEdit:e.endEdit}),h(MediaCropInspector,{clip:e.selected.value,disabled:e.editLocked.value,visible:true,onEdit:patch=>e.editClip(e.selected.value.id,patch),onFit:e.fitSelectedMedia,onBeginEdit:e.beginEdit,onEndEdit:e.endEdit}),h(MediaColorInspector,{clip:e.selected.value,disabled:e.editLocked.value,onEdit:patch=>e.editClip(e.selected.value.id,patch),onBeginEdit:e.beginEdit,onEndEdit:e.endEdit}),h(MediaAnimationInspector,{clip:e.selected.value,disabled:e.editLocked.value,onEdit:patch=>e.editClip(e.selected.value.id,patch),onBeginEdit:e.beginEdit,onEndEdit:e.endEdit})]:'请选择图片或视频')])])}}).mount('#app')
</script></html>
