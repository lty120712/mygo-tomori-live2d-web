<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>MP4 索引与拖动定位验证</title>
<style>body{font:15px system-ui;margin:24px;background:#f6f3f5;color:#342e35}main{max-width:1000px;margin:auto}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap}video{width:100%;max-height:480px;background:#222;margin:16px 0}button,input{padding:8px}output{display:block;margin:12px 0;white-space:pre-wrap}label{display:block}input[type=range]{width:100%;box-sizing:border-box}</style>
<div id="app"></div><script type="module">
import {createApp,h,ref} from 'vue'
import {transcodeMp4} from '../../src/mp4Transcoder.js'
createApp({setup(){const video=ref(null),source=ref(null),url=ref(''),status=ref('选择本机 MP4，在本页本地整理索引，不上传文件。'),metadata=ref(''),time=ref(0),duration=ref(0),busy=ref(false)
function inspect(){const v=video.value;time.value=v.currentTime;duration.value=Number.isFinite(v.duration)?v.duration:0;metadata.value=JSON.stringify({duration:v.duration,currentTime:v.currentTime,readyState:v.readyState,seekable:Array.from({length:v.seekable.length},(_,i)=>[v.seekable.start(i),v.seekable.end(i)])},null,2)}
function load(blob){if(url.value)URL.revokeObjectURL(url.value);url.value=URL.createObjectURL(blob)}
async function repair(){busy.value=true;status.value='正在整理索引…';try{const out=await transcodeMp4(source.value);load(out);const a=document.createElement('a');a.href=url.value;a.download='tomori-reindexed.mp4';a.click();status.value='索引整理完成，已下载修复副本；可前后拖动检查。'}catch(error){status.value=error.message}finally{busy.value=false}}
function seek(value){video.value.currentTime=Math.max(0,Math.min(duration.value,Number(value)))}
return()=>h('main',[h('h2','MP4 索引与拖动定位 · 本地隔离验证'),h('header',[h('label',['选择本机 MP4',h('input',{type:'file',accept:'.mp4','aria-label':'选择本机 MP4',onChange:e=>{source.value=e.target.files[0];if(source.value)load(source.value)}})]),h('button',{disabled:!source.value||busy.value,onClick:repair},'整理索引并下载'),h('button',{disabled:!url.value,onClick:()=>seek(duration.value*.8)},'跳转 80%'),h('button',{disabled:!url.value,onClick:()=>seek(duration.value*.2)},'跳转 20%')]),h('video',{ref:video,src:url.value||undefined,controls:true,preload:'auto',onLoadedmetadata:inspect,onLoadeddata:inspect,onSeeked:()=>{inspect();status.value='已完成定位：'+video.value.currentTime.toFixed(3)+' 秒'},onTimeupdate:inspect}),h('label',['拖动定位时间条',h('input',{type:'range',min:0,max:duration.value,step:.01,value:time.value,'aria-label':'验证拖动定位',onInput:e=>seek(e.target.value)})]),h('output',status.value),h('output',metadata.value)])}}).mount('#app')
</script></html>
