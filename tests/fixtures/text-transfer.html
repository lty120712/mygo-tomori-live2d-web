<!doctype html>
<html lang="zh-CN"><meta charset="UTF-8"><title>文字跨轨回归</title><body>
<div id="app"></div>
<script type="module">
import {createApp,h,ref} from 'vue'
import MultiTimeline from '../../src/components/MultiTimeline.vue'
import {createTextClip} from '../../src/mediaTracks.js'
import {applyTextTransfer,textPlacement} from '../../src/textClipPlacement.js'
import {createEditHistory} from '../../src/editHistory.js'
createApp({setup(){
  const make=(id,track,start)=>({...createTextClip(start,2,track),id,name:id,layerName:'文字层'+track})
  const clips=ref([make('文字甲',0,0),make('文字乙',0,5),make('文字丙',1,0)]),selected=ref([]),time=ref(0)
  const history=createEditHistory({capture:()=>({project:structuredClone(clips.value.map(c=>JSON.parse(JSON.stringify(c))))}),restore:s=>{clips.value=s.project}})
  return ()=>h('main',[
    h('p','隔离测试：不会读写用户工程。文字甲与乙共轨；可把甲拖到丙轨的空档或边缘。'),
    h('button',{onClick:()=>history.undo()},'撤销'),h('button',{onClick:()=>history.redo()},'重做'),
    h('pre',{id:'result'},JSON.stringify(clips.value.map(({id,track,start,duration})=>({id,track,start,duration})))),
    h(MultiTimeline,{clips:clips.value,selectedIds:selected.value,duration:12,fps:30,time:time.value,labels:{},pose:{},runtimes:{},transformFields:[],
      onSelect:id=>{selected.value=[id]},onSelectionChange:ids=>{selected.value=ids},onSeek:value=>{time.value=Math.round(value*30)/30},
      onBeginEdit:()=>history.begin(),onEndEdit:()=>history.end(),
      onBatchClips:action=>{if(action.type==='transfer-text'){history.end();history.edit(()=>applyTextTransfer(clips.value,action,{duration:12,fps:30}))}},
      onAddText:()=>{const p=textPlacement(clips.value,time.value,Math.min(5,12-time.value));if(p)history.edit(()=>clips.value.push({...createTextClip(time.value,p.duration,p.track),...p.layer}))}
    })
  ])
}}).mount('#app')
</script></body></html>
