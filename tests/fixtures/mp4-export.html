<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>MP4 转码回归验证</title>
<body><button id="run">验证 WebM 转 MP4</button><p id="status">待开始</p><canvas width="160" height="90"></canvas>
<script type="module">
import { transcodeMp4 } from '../../src/mp4Transcoder.js'
const button=document.querySelector('button'),status=document.querySelector('p'),canvas=document.querySelector('canvas')
button.onclick=async()=>{
  button.disabled=true
  const context=new AudioContext(),osc=context.createOscillator(),destination=context.createMediaStreamDestination()
  osc.connect(destination);osc.start();await context.resume()
  const stream=canvas.captureStream(30);stream.addTrack(destination.stream.getAudioTracks()[0])
  const recorder=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp8,opus'}),chunks=[]
  let raf
  const draw=()=>{const c=canvas.getContext('2d');c.fillStyle='#20ab70';c.fillRect(0,0,160,90);c.fillStyle='white';c.fillText(String(performance.now()),10,40);raf=requestAnimationFrame(draw)}
  draw();recorder.ondataavailable=e=>chunks.push(e.data)
  recorder.onstop=async()=>{
    cancelAnimationFrame(raf);osc.stop();await context.close();stream.getTracks().forEach(t=>t.stop())
    try{
      status.textContent='正在转换 MP4'
      const blob=await transcodeMp4(new Blob(chunks,{type:'video/webm'}),{progress:p=>status.textContent='转换进度 '+Math.round(p*100)+'%'})
      const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='tomori-transcode-regression.mp4';a.click()
      status.textContent='转换成功：'+blob.type+'，'+blob.size+' 字节';setTimeout(()=>URL.revokeObjectURL(url),1000)
    }catch(e){status.textContent='失败：'+String(e)}finally{button.disabled=false}
  }
  recorder.start();status.textContent='生成带音轨的 WebM 测试素材';setTimeout(()=>recorder.stop(),1000)
}
</script></body></html>
