<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>导出片段验证</title><style>body{font:15px system-ui;background:#f7f3f5;color:#342e35;margin:24px}main{max-width:1000px;margin:auto}video{width:100%;max-height:480px;background:#222;margin:16px 0}button{padding:8px}pre{white-space:pre-wrap;padding:16px;background:white}</style><main><h2>区间导出 · 文件与音频检查</h2><p>本机文件仅在浏览器内读取，不上传。</p><input aria-label="验证视频" type="file" accept="video/mp4"><button id="analyze">分析音轨</button><video controls preload="auto"></video><pre id="result"></pre></main><script>
const input=document.querySelector('input'),video=document.querySelector('video'),result=document.querySelector('#result');let url='',audio=null
function inspect(){result.textContent=JSON.stringify({duration:video.duration,width:video.videoWidth,height:video.videoHeight,time:video.currentTime,audio},null,2)}
input.onchange=()=>{if(url)URL.revokeObjectURL(url);audio=null;url=URL.createObjectURL(input.files[0]);video.src=url}
video.onloadeddata=inspect;video.onseeked=inspect
document.querySelector('#analyze').onclick=async()=>{try{const ctx=new OfflineAudioContext(2,1,48000),buffer=await ctx.decodeAudioData(await input.files[0].arrayBuffer()),data=buffer.getChannelData(0),rms=[];for(let segment=0;segment<4;segment++){const start=Math.floor(segment*data.length/4),end=Math.floor((segment+1)*data.length/4);let sum=0;for(let i=start;i<end;i++)sum+=data[i]*data[i];rms.push(Math.sqrt(sum/(end-start)))}audio={duration:buffer.duration,quarterRms:rms};inspect()}catch(error){result.textContent=error.message}}
</script></html>
