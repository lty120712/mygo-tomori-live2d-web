<style>:root{font:13px system-ui;--editor-panel:#fff;--editor-soft:#f6f3f5;--editor-text:#342e35;--editor-muted:#817580;--editor-accent:#743a52;--editor-border:#ded5dc;--editor-focus:#ac7991;--editor-accent-soft:#f3e4eb;--editor-hover:#f6eaf0;--editor-radius:6px}body{margin:16px;background:#f6f3f5;color:#342e35}main{min-width:1050px}header{display:flex;gap:8px;align-items:center;margin-bottom:12px}.layout{display:grid;grid-template-columns:minmax(600px,1fr) 300px;gap:16px}.preview{height:480px;display:flex;flex-direction:column}aside{padding:16px;background:white}button{cursor:pointer;padding:6px}pre{white-space:pre-wrap;font-size:11px;max-height:120px;overflow:auto}output{display:block;padding:10px;background:white}.timeline{height:280px;margin-top:16px}</style><div id="app"></div><script type="module">
